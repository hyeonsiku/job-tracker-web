<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Job Tracker</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><style>:root{--bg:#f5f7fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--danger:#dc2626}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}header{background:#111827;color:#fff;padding:18px 24px;display:flex;justify-content:space-between}main{max-width:1500px;margin:24px auto;padding:0 18px}.auth,.card,.table-wrap{background:#fff;border:1px solid var(--line);border-radius:12px}.auth,.card{padding:18px;margin-bottom:16px}.auth{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.auth-form,.toolbar,.actions,.modal-actions{display:flex;gap:8px;flex-wrap:wrap}.toolbar{margin-bottom:14px}input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:9px;background:#fff}#search{min-width:280px;flex:1}.btn{border:0;border-radius:8px;padding:9px 14px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}.btn.secondary{background:#e5e7eb;color:#111827}.btn.danger{background:var(--danger)}.btn.small{padding:6px 9px;font-size:12px}.stats{display:flex;gap:8px;flex-wrap:wrap}.stat{border:1px solid var(--line);border-radius:10px;padding:9px 13px;min-width:85px}.stat b{display:block;font-size:20px}.stat small,.sub,.notice{color:var(--muted)}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1250px}th,td{padding:11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:12px;color:var(--muted);background:#fafafa}.company{font-weight:700;color:var(--accent);text-decoration:none}.sub{font-size:12px;margin-top:3px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff;font-size:12px;font-weight:700}.empty{text-align:center;color:var(--muted);padding:30px}.hidden{display:none!important}.error{color:var(--danger);font-size:13px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.open{display:flex}.dialog{background:#fff;border-radius:14px;width:min(800px,100%);max-height:90vh;overflow:auto;padding:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted);font-weight:700}.field textarea{min-height:80px}.modal-actions{justify-content:flex-end;margin-top:18px}@media(max-width:700px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}</style></head><body><header><b>Job Tracker</b><span id="countText"></span></header><main><section id="authSection" class="auth"><span id="message" class="notice">ログインしてください。</span><div class="auth-form"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button class="btn" id="signInBtn">ログイン</button><button class="btn secondary" id="signUpBtn">新規登録</button></div></section><section id="app" class="hidden"><div class="card"><div class="toolbar"><input id="search" placeholder="会社名・求人名・技術・メモを検索"><select id="employmentFilter"><option value="">雇用形態</option><option>正社員</option><option>フリーランス</option></select><select id="statusFilter"></select><select id="typeFilter"><option value="">タイプ</option><option>自社開発</option><option>受託開発</option><option>SES/プロジェクト</option><option>混合</option><option>不明</option></select><button class="btn" id="newBtn">＋ 会社追加</button><button class="btn secondary" id="signOutBtn">ログアウト</button></div><div id="stats" class="stats"></div></div><div class="table-wrap"><table><thead><tr><th>会社 / 求人</th><th>雇用</th><th>タイプ</th><th>年収 / 単価</th><th>リモート</th><th>状態</th><th>面接日時</th><th>適合</th><th>操作</th></tr></thead><tbody id="tbody"></tbody></table></div></section></main><div id="modal" class="modal"><div class="dialog"><h2 id="modalTitle">会社追加</h2><form id="jobForm"><div class="grid"><div class="field"><label>会社名 *</label><input id="fCompany"></div><div class="field"><label>求人名</label><input id="fTitle"></div><div class="field"><label>雇用形態</label><select id="fEmployment"><option>正社員</option><option>フリーランス</option></select></div><div class="field"><label>タイプ</label><select id="fType"><option>自社開発</option><option>受託開発</option><option>SES/プロジェクト</option><option>混合</option><option>不明</option></select></div><div class="field"><label>年収 / 単価</label><input id="fSalary"></div><div class="field"><label>リモート</label><input id="fRemote"></div><div class="field"><label>状態</label><select id="fStatus"></select></div><div class="field"><label>適合度</label><select id="fFit"><option value="5">5</option><option value="4">4</option><option value="3" selected>3</option><option value="2">2</option><option value="1">1</option></select></div><div class="field"><label>応募日</label><input id="fApplied" type="date"></div><div class="field"><label>面接日</label><input id="fInterviewDate" type="date"></div><div class="field"><label>面接時間</label><input id="fInterviewTime" type="time"></div><div class="field"><label>求人URL</label><input id="fUrl" type="url"></div><div class="field full"><label>求人票PDF（10MB以下）</label><input id="fPdf" type="file" accept="application/pdf"><small id="currentPdf" class="notice">PDFなし</small></div><div class="field full"><label>技術 / ポジション</label><textarea id="fTech"></textarea></div><div class="field full"><label>長所</label><textarea id="fPros"></textarea></div><div class="field full"><label>注意点 / 面接確認</label><textarea id="fCaution"></textarea></div><div class="field full"><label>メモ</label><textarea id="fMemo"></textarea></div></div><div id="formError" class="error"></div><div class="modal-actions"><button type="button" class="btn secondary" id="cancelBtn">キャンセル</button><button class="btn" id="saveBtn">保存</button></div></form></div></div><script src="js/app.js"></script></body></html>
