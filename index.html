<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Job Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--danger:#dc2626}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}header{background:#111827;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}header h1{font-size:20px;margin:0}header span{font-size:12px;color:#cbd5e1}main{max-width:1400px;margin:24px auto;padding:0 18px}.auth{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;display:flex;gap:10px;align-items:center;justify-content:space-between}.auth-form{display:flex;gap:8px;flex-wrap:wrap}.tabs{display:flex;gap:8px;margin-bottom:16px}.tab{border:1px solid var(--line);background:#fff;color:#374151;border-radius:8px;padding:9px 18px;cursor:pointer;font-weight:700}.tab.active{background:#111827;color:#fff}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:9px;background:#fff}#search{min-width:260px;flex:1}.btn{border:0;border-radius:8px;padding:9px 14px;cursor:pointer;background:var(--accent);color:#fff;font-weight:600}.btn.secondary{background:#e5e7eb;color:#111827}.btn.danger{background:var(--danger)}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;min-width:120px}.stat b{display:block;font-size:20px}.stat small{color:var(--muted)}.table-wrap{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:1100px}th,td{padding:12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:12px;color:var(--muted);background:#fafafa}tr:last-child td{border-bottom:0}.company{font-weight:700;color:var(--accent);cursor:pointer}.company:hover{text-decoration:underline}.sub{font-size:12px;color:var(--muted);margin-top:3px}.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:700;background:#eef2ff}.badge.reject{background:#fee2e2;color:#991b1b}.badge.interview{background:#fef3c7;color:#92400e}.badge.offer{background:#dcfce7;color:#166534}.score{font-weight:800}.actions{display:flex;gap:5px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.open{display:flex}.dialog{background:#fff;border-radius:14px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:22px}.dialog h2{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted);font-weight:700}textarea{min-height:90px;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.hidden{display:none!important}.notice{color:var(--muted);font-size:14px}.error{color:var(--danger);font-size:13px;margin-top:8px}@media(max-width:700px){main{padding:0 10px}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.auth{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header><h1>Job Tracker</h1><span id="countText"></span></header>
<main>
<section class="auth" id="authSection">
  <div id="authMessage" class="notice">로그인하면 구직 데이터가 표시됩니다.</div>
  <div id="authForm" class="auth-form"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button class="btn" id="signInBtn">로그인</button><button class="btn secondary" id="signUpBtn">회원가입</button></div>
  <div id="signedIn" class="hidden"><span id="userEmail"></span> <button class="btn secondary" id="signOutBtn">로그아웃</button></div>
</section>
<section id="app" class="hidden">
<div class="tabs"><button class="tab active" id="tabEmployee">正社員</button><button class="tab" id="tabFreelance">フリーランス</button></div>
<div class="toolbar"><input id="search" placeholder="会社名・求人名・技術・メモを検索"><select id="statusFilter"><option value="">すべての状態</option></select><select id="typeFilter"><option value="">すべてのタイプ</option><option>自社開発</option><option>受託開発</option><option>SES/プロジェクト</option><option>混合</option><option>不明</option></select><button class="btn" id="newBtn">＋ 会社追加</button></div>
<div class="stats" id="stats"></div><div class="table-wrap"><table><thead><tr><th>会社 / 求人</th><th>タイプ</th><th>年収 / 単価</th><th>リモート</th><th>状態</th><th>面接日時</th><th>適合</th><th>応募日</th><th></th></tr></thead><tbody id="tbody"></tbody></table></div>
</section>
</main>
<div class="modal" id="modal"><div class="dialog"><h2 id="modalTitle">会社追加</h2><div class="grid">
<div class="field"><label>会社名</label><input id="fCompany"></div><div class="field"><label>求人名</label><input id="fTitle"></div><div class="field"><label>雇用形態</label><select id="fEmployment"><option>正社員</option><option>フリーランス</option></select></div><div class="field"><label>タイプ</label><select id="fType"><option>自社開発</option><option>受託開発</option><option>SES/プロジェクト</option><option>混合</option><option>不明</option></select></div><div class="field"><label>年収 / 単価</label><input id="fSalary" placeholder="530–940万円 / 65万円"></div><div class="field"><label>リモート</label><input id="fRemote" placeholder="フルリモート / 週2 / 不明"></div><div class="field"><label>状態</label><select id="fStatus"></select></div><div class="field"><label>適合度</label><select id="fFit"><option value="5">5 / かなり合う</option><option value="4">4 / 合う</option><option value="3">3 / 보통</option><option value="2">2 / 낮음</option><option value="1">1 / 거의 안 맞음</option></select></div><div class="field"><label>応募日</label><input id="fApplied" type="date"></div><div class="field"><label>面接日</label><input id="fInterviewDate" type="date"></div><div class="field"><label>面接時間</label><input id="fInterviewTime" type="time"></div><div class="field full"><label>URL</label><input id="fUrl" placeholder="求人URL"></div><div class="field full"><label>求人票PDF</label><input id="fPdf" type="file" accept="application/pdf"><small class="notice" id="currentPdf"></small></div><div class="field full"><label>기술 / 포지션 메모</label><textarea id="fTech"></textarea></div><div class="field full"><label>장점</label><textarea id="fPros"></textarea></div><div class="field full"><label>주의점 / 면접에서 확인</label><textarea id="fCaution"></textarea></div><div class="field full"><label>자유 메모</label><textarea id="fMemo"></textarea></div></div><div id="formError" class="error"></div><div class="modal-actions"><button class="btn secondary" id="cancelBtn">취소</button><button class="btn" id="saveBtn">저장</button></div></div></div>
<script>
const SUPABASE_URL="https://kkvinqltevqxzerkmbro.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="YOUR_SUPABASE_PUBLISHABLE_KEY";
const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const statuses=["검토","지원","서류","면접","최종","오퍼","탈락","보류","辞退"];
let jobs=[],editingId=null,currentEmployment="正社員",currentUser=null;
const $=id=>document.getElementById(id);
function esc(s=""){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function badge(s){const c=s==="탈락"||s==="辞退"?"reject":s==="면접"||s==="최종"?"interview":s==="오퍼"?"offer":"";return `<span class="badge ${c}">${esc(s||"")}</span>`}
async function loadJobs(){if(!currentUser)return;const {data,error}=await supabase.from("jobs").select("*").order("created_at",{ascending:false});if(error){showError(error.message);return}jobs=data||[];render()}
function render(){const q=$("search").value.toLowerCase(),sf=$("statusFilter").value,tf=$("typeFilter").value;const filtered=jobs.filter(j=>(j.employment||"正社員")===currentEmployment&&(!q||JSON.stringify(j).toLowerCase().includes(q))&&(!sf||j.status===sf)&&(!tf||j.type===tf));$("countText").textContent=`${filtered.length}개 회사`;$('tbody').innerHTML=filtered.map(j=>`<tr><td><div class="company" onclick="openCompany('${j.id}')">${esc(j.company)}</div><div class="sub">${esc(j.title)}</div></td><td>${esc(j.type)}</td><td>${esc(j.salary)}</td><td>${esc(j.remote)}</td><td>${badge(j.status)}</td><td>${j.interview_date||j.interview_time?`${esc(j.interview_date||"")} ${esc(j.interview_time||"")}`.trim():"—"}</td><td class="score">${"★".repeat(Number(j.fit||0))}${"☆".repeat(5-Number(j.fit||0))}</td><td>${esc(j.applied||"—")}</td><td><div class="actions"><button class="btn secondary" onclick="editJob('${j.id}')">수정</button><button class="btn danger" onclick="removeJob('${j.id}')">삭제</button></div></td></tr>`).join("")||'<tr><td colspan="9" style="text-align:center;color:#6b7280;padding:30px">조건에 맞는 회사가 없습니다.</td></tr>';$("stats").innerHTML=statuses.map(s=>`<div class="stat"><b>${jobs.filter(j=>(j.employment||"正社員")===currentEmployment&&j.status===s).length}</b><small>${s}</small></div>`).join("")}
function openCompany(id){location.href=`company.html?id=${encodeURIComponent(id)}`}
function fillStatuses(){$("statusFilter").innerHTML='<option value="">すべての状態</option>'+statuses.map(s=>`<option>${s}</option>`).join("");$("fStatus").innerHTML=statuses.map(s=>`<option>${s}</option>`).join("")}
function clearForm(){["fCompany","fTitle","fSalary","fRemote","fApplied","fInterviewDate","fInterviewTime","fUrl","fTech","fPros","fCaution","fMemo","fPdf"].forEach(id=>$(id).value="");$("fEmployment").value=currentEmployment;$("fType").value="不明";$("fStatus").value="검토";$("fFit").value="3";$("currentPdf").textContent="";$("formError").textContent=""}
function openNew(){editingId=null;$("modalTitle").textContent="会社追加";clearForm();$("modal").classList.add("open")}
function editJob(id){const j=jobs.find(x=>x.id===id);editingId=id;$("modalTitle").textContent="会社修正";[["fCompany","company"],["fTitle","title"],["fSalary","salary"],["fRemote","remote"],["fApplied","applied"],["fInterviewDate","interview_date"],["fInterviewTime","interview_time"],["fUrl","url"],["fTech","tech"],["fPros","pros"],["fCaution","caution"],["fMemo","memo"]].forEach(([a,b])=>$(a).value=j[b]||"");$("fEmployment").value=j.employment||"正社員";$("fType").value=j.type||"不明";$("fStatus").value=j.status||"검토";$("fFit").value=j.fit||3;$("fPdf").value="";$("currentPdf").textContent=j.pdf_path?`현재 PDF: ${j.pdf_path.split("/").pop()}`:"PDF 없음";$("formError").textContent="";$("modal").classList.add("open")}
async function saveForm(){const v={company:$("fCompany").value.trim(),title:$("fTitle").value.trim(),employment:$("fEmployment").value,type:$("fType").value,salary:$("fSalary").value.trim(),remote:$("fRemote").value.trim(),status:$("fStatus").value,fit:Number($("fFit").value),applied:$("fApplied").value||null,interview_date:$("fInterviewDate").value||null,interview_time:$("fInterviewTime").value||null,url:$("fUrl").value.trim()||null,tech:$("fTech").value,pros:$("fPros").value,caution:$("fCaution").value,memo:$("fMemo").value};if(!v.company){$("formError").textContent="会社名を入力してください。";return}$("saveBtn").disabled=true;$("formError").textContent="";try{let id=editingId;if(id){const {error}=await supabase.from("jobs").update(v).eq("id",id);if(error)throw error}else{const {data,error}=await supabase.from("jobs").insert({...v,user_id:currentUser.id}).select("id").single();if(error)throw error;id=data.id}const file=$("fPdf").files[0];if(file){if(file.type!=="application/pdf")throw new Error("PDFのみアップロードできます。");if(file.size>10*1024*1024)throw new Error("PDFは10MB以下にしてください。");const path=`${currentUser.id}/${id}/${crypto.randomUUID()}.pdf`;const {error:uploadError}=await supabase.storage.from("job-pdfs").upload(path,file,{contentType:"application/pdf",upsert:false});if(uploadError)throw uploadError;const {error:updateError}=await supabase.from("jobs").update({pdf_path:path}).eq("id",id);if(updateError)throw updateError}closeModal();await loadJobs()}catch(e){console.error(e);$("formError").textContent=e.message||"保存に失敗しました。"}finally{$("saveBtn").disabled=false}}
async function removeJob(id){if(!confirm("이 회사를 삭제할까요?"))return;const j=jobs.find(x=>x.id===id);if(j?.pdf_path)await supabase.storage.from("job-pdfs").remove([j.pdf_path]);const {error}=await supabase.from("jobs").delete().eq("id",id);if(error){showError(error.message);return}await loadJobs()}
function closeModal(){$("modal").classList.remove("open")}
function showError(message){$("authMessage").textContent=message;$("authMessage").className="error"}
async function signIn(){const {error}=await supabase.auth.signInWithPassword({email:$("email").value,password:$("password").value});if(error)showError(error.message)}
async function signUp(){const {error}=await supabase.auth.signUp({email:$("email").value,password:$("password").value});if(error)showError(error.message);else $("authMessage").textContent="회원가입 요청 완료. 이메일 확인이 필요한 경우 메일을 확인하세요."}
async function signOut(){await supabase.auth.signOut()}
async function updateAuth(){const {data}=await supabase.auth.getUser();currentUser=data.user||null;$("authForm").classList.toggle("hidden",!!currentUser);$("signedIn").classList.toggle("hidden",!currentUser);$("app").classList.toggle("hidden",!currentUser);if(currentUser){$("userEmail").textContent=currentUser.email;$("authMessage").className="notice";$("authMessage").textContent="로그인됨";await loadJobs()}else{$("countText").textContent="";jobs=[]}}
$("signInBtn").onclick=signIn;$("signUpBtn").onclick=signUp;$("signOutBtn").onclick=signOut;$("newBtn").onclick=openNew;$("cancelBtn").onclick=closeModal;$("saveBtn").onclick=saveForm;$("search").oninput=render;$("statusFilter").onchange=render;$("typeFilter").onchange=render;$("tabEmployee").onclick=()=>{currentEmployment="正社員";$("tabEmployee").classList.add("active");$("tabFreelance").classList.remove("active");render()};$("tabFreelance").onclick=()=>{currentEmployment="フリーランス";$("tabFreelance").classList.add("active");$("tabEmployee").classList.remove("active");render()};fillStatuses();supabase.auth.onAuthStateChange(()=>updateAuth());updateAuth();
</script>
</body>
</html>
