<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Job Detail - Job Tracker</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><style>:root{--bg:#f5f7fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--danger:#dc2626}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}header{background:#111827;color:#fff;padding:16px 24px;display:flex;justify-content:space-between}main{max-width:1100px;margin:24px auto;padding:0 18px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:16px}.top{display:flex;justify-content:space-between;gap:16px}.company{font-size:26px;font-weight:800}.title{color:var(--muted);margin-top:6px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.item{border:1px solid var(--line);border-radius:10px;padding:12px}.item small{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.btn{display:inline-block;border:0;border-radius:8px;padding:9px 14px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;text-decoration:none}.btn.secondary{background:#e5e7eb;color:#111827}.btn.danger{background:var(--danger)}.actions{display:flex;gap:8px;flex-wrap:wrap}.text{white-space:pre-wrap;line-height:1.7}.pdf-box{border:1px solid var(--line);border-radius:10px;overflow:hidden}.pdf-box iframe{display:block;width:100%;height:800px;border:0}.notice{color:var(--muted)}.error{color:var(--danger)}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.top{flex-direction:column}}@media(max-width:500px){.grid{grid-template-columns:1fr}main{padding:0 10px}.company{font-size:22px}}
</style></head><body><header><b>Job Tracker</b><a class="btn secondary" href="index.html">← 一覧</a></header><main id="app"><div class="card notice">読み込み中...</div></main><script>
const db=window.supabase.createClient(SUPABASE_CONFIG.url,SUPABASE_CONFIG.publishableKey);const id=new URLSearchParams(location.search).get("id");const app=document.getElementById("app");const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
async function signedUrl(path){const r=await db.storage.from("job-pdfs").createSignedUrl(path,600);if(r.error)throw r.error;return r.data.signedUrl;}
async function removePdf(path){if(!path)return;const r=await db.storage.from("job-pdfs").remove([path]);if(r.error)throw r.error;}
async function init(){const s=await db.auth.getSession();if(!s.data.session){location.href="index.html";return;}const r=await db.from("jobs").select("*").eq("id",id).single();if(r.error||!r.data){app.innerHTML='<div class="card"><h2>求人が見つかりません</h2><a class="btn" href="index.html">一覧へ戻る</a></div>';return;}const j=r.data;let pdf=null;if(j.pdf_path){try{pdf=await signedUrl(j.pdf_path);}catch(e){console.error(e);}}app.innerHTML=`<section class="card"><div class="top"><div><div class="company">${esc(j.company)}</div><div class="title">${esc(j.title)}</div></div><div class="actions"><a class="btn secondary" href="index.html">一覧</a>${j.url?`<a class="btn secondary" href="${esc(j.url)}" target="_blank" rel="noopener">求人URL</a>`:""}<button class="btn danger" id="deleteBtn">この求人を削除</button></div></div></section><section class="card"><div class="grid"><div class="item"><small>雇用形態</small><b>${esc(j.employment)}</b></div><div class="item"><small>タイプ</small><b>${esc(j.type)}</b></div><div class="item"><small>年収 / 単価</small><b>${esc(j.salary)}</b></div><div class="item"><small>リモート</small><b>${esc(j.remote)}</b></div><div class="item"><small>状態</small><b>${esc(j.status)}</b></div><div class="item"><small>適合度</small><b>${esc(j.fit)} / 5</b></div><div class="item"><small>応募日</small><b>${esc(j.applied||"—")}</b></div><div class="item"><small>面接日時</small><b>${esc([j.interview_date,j.interview_time].filter(Boolean).join(" ")||"—")}</b></div></div></section><section class="card"><h2>求人票（JD）</h2>${pdf?`<div class="actions" style="margin-bottom:10px"><a class="btn" href="${pdf}" target="_blank" rel="noopener">PDFを開く</a><button class="btn danger" id="pdfDeleteBtn">PDFを削除</button></div><div class="pdf-box"><iframe src="${pdf}" title="Job Description PDF"></iframe></div>`:'<p class="notice">求人票PDFはありません。</p>'}</section><section class="card"><h2>技術 / ポジション</h2><div class="text">${esc(j.tech||"—")}</div></section><section class="card"><h2>自分用メモ</h2><div class="text">長所\n${esc(j.pros||"—")}\n\n注意点 / 面接確認\n${esc(j.caution||"—")}\n\nメモ\n${esc(j.memo||"—")}</div></section>`;
$("deleteBtn").onclick=async()=>{if(!confirm("この求人を削除しますか？"))return;const r=await db.from("jobs").delete().eq("id",id);if(r.error)return alert(r.error.message);if(j.pdf_path)await removePdf(j.pdf_path);location.href="index.html";};const pdfBtn=$("pdfDeleteBtn");if(pdfBtn)pdfBtn.onclick=async()=>{if(!confirm("PDFを削除しますか？"))return;try{await removePdf(j.pdf_path);const r=await db.from("jobs").update({pdf_path:null}).eq("id",id);if(r.error)throw r.error;location.reload();}catch(e){alert(e.message);}};}
init();
</script></body></html>
