<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Company Detail - Job Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>:root{--bg:#f5f7fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--danger:#dc2626}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}header{background:#111827;color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}header h1{font-size:19px;margin:0}main{max-width:1150px;margin:24px auto;padding:0 18px}.btn{display:inline-block;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;background:var(--accent);color:#fff;font-weight:600;text-decoration:none}.btn.secondary{background:#e5e7eb;color:#111827}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:16px}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.company{font-size:26px;font-weight:800}.title{color:var(--muted);margin-top:6px;line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.item{border:1px solid var(--line);border-radius:10px;padding:12px}.item small{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.item b{font-size:15px}.badge{display:inline-block;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:700;background:#eef2ff}.interview{background:#fef3c7;color:#92400e}.offer{background:#dcfce7;color:#166534}.reject{background:#fee2e2;color:#991b1b}h2{font-size:18px;margin:0 0 14px}.text{white-space:pre-wrap;line-height:1.8}.jd{background:#fbfcfe;border:1px solid var(--line);border-radius:10px;padding:22px;min-height:180px;font-size:14px;line-height:1.8;white-space:pre-wrap;word-break:break-word}.loading{color:var(--muted)}.error{color:var(--danger)}.jd-page{border-top:1px solid #eef0f3;padding:22px 0}.jd-page:first-child{border-top:0;padding-top:0}.jd-page-label{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:10px;text-align:right}.jd-line{min-height:1.8em}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.top{flex-direction:column}}@media(max-width:500px){.grid{grid-template-columns:1fr}main{padding:0 10px}.card{padding:16px}.company{font-size:22px}}</style>
</head>
<body><header><h1>Job Tracker</h1><a class="btn secondary" href="index.html">← 목록</a></header><main id="app"><div class="card loading">会社情報を読み込んでいます...</div></main>
<script>
const SUPABASE_URL="https://kkvinqltevqxzerkmbro.supabase.co";const SUPABASE_PUBLISHABLE_KEY="YOUR_SUPABASE_PUBLISHABLE_KEY";const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);const id=new URLSearchParams(location.search).get("id");const app=document.getElementById("app");
function esc(s=""){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}function badge(s){const c=s==="面接"||s==="最終"?"interview":s==="オファー"?"offer":s==="탈락"||s==="辞退"?"reject":"";return `<span class="badge ${c}">${esc(s)}</span>`}
async function init(){const {data:{user}}=await supabase.auth.getUser();if(!user){location.href="index.html";return}const {data:job,error}=await supabase.from("jobs").select("*").eq("id",id).single();if(error||!job){app.innerHTML='<div class="card"><h2>会社が見つかりません</h2><a class="btn" href="index.html">一覧へ戻る</a></div>';return}const pdfLink=job.pdf_path?await signedUrl(job.pdf_path):null;app.innerHTML=`<section class="card"><div class="top"><div><div class="company">${esc(job.company)}</div><div class="title">${esc(job.title)}</div></div><div class="actions"><a class="btn secondary" href="index.html">一覧へ戻る</a>${pdfLink?`<a class="btn" href="${pdfLink}" target="_blank" rel="noopener">原本PDFを見る</a>`:""}${job.url?`<a class="btn secondary" href="${esc(job.url)}" target="_blank" rel="noopener">求人URL</a>`:""}</div></div></section><section class="card"><div class="grid"><div class="item"><small>雇用形態</small><b>${esc(job.employment||"—")}</b></div><div class="item"><small>タイプ</small><b>${esc(job.type||"—")}</b></div><div class="item"><small>年収 / 単価</small><b>${esc(job.salary||"—")}</b></div><div class="item"><small>リモート</small><b>${esc(job.remote||"—")}</b></div><div class="item"><small>状態</small><b>${badge(job.status)}</b></div><div class="item"><small>適合度</small><b>${"★".repeat(Number(job.fit||0))}${"☆".repeat(5-Number(job.fit||0))}</b></div><div class="item"><small>応募日</small><b>${esc(job.applied||"—")}</b></div><div class="item"><small>面接日時</small><b>${esc([job.interview_date,job.interview_time].filter(Boolean).join(" ")||"—")}</b></div></div></section><section class="card"><h2>求人票（JD）</h2><div id="jd" class="jd">${pdfLink?"PDFを読み込んでいます...":"求人票PDFはありません。"}</div></section><section class="card"><h2>技術 / ポジション</h2><div class="text">${esc(job.tech||"—")}</div></section><section class="card"><h2>自分用メモ</h2><div class="text"><b>장점</b>\n${esc(job.pros||"—")}\n\n<b>주의점 / 면접 확인</b>\n${esc(job.caution||"—")}\n\n<b>자유 메모</b>\n${esc(job.memo||"—")}</div></section>`;if(pdfLink)loadPdf(pdfLink)}
async function signedUrl(path){const {data,error}=await supabase.storage.from("job-pdfs").createSignedUrl(path,600);if(error){console.error(error);return null}return data.signedUrl}
function groupLines(items){const rows=[];for(const item of items){const x=item.transform?.[4]??0,y=item.transform?.[5]??0;let row=rows.find(r=>Math.abs(r.y-y)<3);if(!row){row={y,items:[]};rows.push(row)}row.items.push({x,str:item.str||""})}rows.sort((a,b)=>b.y-a.y);return rows.map(r=>r.items.sort((a,b)=>a.x-b.x).map(x=>x.str).join(" ").replace(/\s+/g," ").trim())}
async function loadPdf(url){try{const pdf=await import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs");pdf.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";const doc=await pdf.getDocument(url).promise,pages=[];for(let p=1;p<=doc.numPages;p++){const page=await doc.getPage(p),content=await page.getTextContent();pages.push(groupLines(content.items))}const html=pages.map((lines,i)=>`<div class="jd-page"><div class="jd-page-label">Page ${i+1} / ${pages.length}</div>${lines.filter(Boolean).map(line=>`<div class="jd-line">${esc(line)}</div>`).join("")}</div>`).join("");document.getElementById("jd").innerHTML=html||"PDFからテキストを抽出できません。"}catch(e){console.error(e);document.getElementById("jd").innerHTML='<span class="error">PDF 자동 파싱에 실패했습니다. 원본 PDF를 확인하세요.</span>'}}
init();
</script></body></html>
